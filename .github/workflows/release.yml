name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-14
            pi_target_platform: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            pi_target_platform: linux-x64
          - os: ubuntu-24.04-arm
            pi_target_platform: linux-arm64
          - os: windows-2022
            pi_target_platform: windows-x64
          - os: windows-11-arm
            pi_target_platform: windows-arm64

    runs-on: ${{ matrix.os }}

    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_CHECK_REVOKE: "false"

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good rpm patchelf

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .cache/pi-binaries
          key: pi-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pi-version.json') }}

      - name: Fetch pi
        env:
          PI_TARGET_PLATFORM: ${{ matrix.pi_target_platform }}
        run: bun run fetch:pi

      - run: bun run build:extensions

      - name: Deploy default config
        shell: bash
        run: |
          mkdir -p src-tauri/resources/pi/default-config/skills
          cp default-config/settings.json src-tauri/resources/pi/default-config/
          cp default-config/models-store.json src-tauri/resources/pi/default-config/
          cp default-config/auth.json src-tauri/resources/pi/default-config/
          [ -d "default-config/skills" ] && cp -r default-config/skills/* src-tauri/resources/pi/default-config/skills/ || true

      - name: Build Tauri
        shell: bash
        run: |
          BUNDLES=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            BUNDLES="--bundles nsis"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            BUNDLES="--bundles deb,rpm"
          fi
          npx @tauri-apps/cli build $BUNDLES ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guiying-${{ runner.os }}-${{ matrix.pi_target_platform || runner.arch }}
          path: |
            src-tauri/target/release/bundle/
