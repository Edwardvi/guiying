name: Build guiying

# guiying — Pi coding agent desktop IDE, bundled with 23 skills + 2 extensions.
# Builds macOS (arm64 + x64) and Windows from a single workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  # -------------------------------------------------------------------
  # macOS
  # -------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build app
        run: |
          pnpm build:relay 2>&1 || echo "(relay skipped)"
          pnpm build:electron-vite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORCA_BUILD_IDENTITY: null
          ORCA_POSTHOG_WRITE_KEY: null
          ORCA_DIAGNOSTICS_TOKEN_URL: ''

      # macOS build without signing (local ad-hoc)
      - name: Package macOS (unsigned)
        run: |
          pnpm exec electron-builder \
            --config config/electron-builder.config.cjs \
            --mac --${{ matrix.arch }} \
            --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: guiying-macos-${{ matrix.arch }}
          path: |
            dist/guiying-macos-*.dmg
            dist/guiying-macos-*.zip
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Windows
  # -------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build app
        run: |
          pnpm build:relay 2>&1 || echo "(relay skipped)"
          pnpm build:electron-vite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORCA_BUILD_IDENTITY: null
          ORCA_POSTHOG_WRITE_KEY: null
          ORCA_DIAGNOSTICS_TOKEN_URL: ''

      # Windows: skip signing
      - name: Package Windows (unsigned)
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: guiying-windows
          path: dist/guiying-windows-setup*.exe
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Release — create GitHub Release + attach all artifacts (tags only)
  # -------------------------------------------------------------------
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Display structure
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: guiying ${{ github.ref_name }}
          body: |
            ## guiying ${{ github.ref_name }}
            
            Pi coding agent desktop IDE with 23 skills + 2 extensions bundled.
            
            ### macOS
            - Download the DMG for your Mac (Apple Silicon or Intel)
            - Open DMG, drag guiying to Applications
            - First launch will auto-install Pi and skills
            
            ### Windows
            - Download the .exe installer
            - Run installer, follow prompts
            - First launch will auto-install Pi and skills
            
            ### Skills included
            4alaodeng, 4azhongdeng, cavecrew, caveman (7 modules), design-deck, editorial-deck, fxxk4a, grill-me, nuwa, planning-with-files, pro-presentation, guizang-ppt-skill, html-ppt, web-access, huashu-design, mao, 策展, 策展-framework
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
